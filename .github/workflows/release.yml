name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build all targets
        run: |
          mkdir -p dist
          for t in \
            linux/amd64 linux/arm64 "linux/arm:7" linux/386 \
            "linux/mips:softfloat" "linux/mipsle:softfloat" linux/riscv64 \
            windows/amd64 windows/arm64 windows/386 \
            darwin/amd64 darwin/arm64 freebsd/amd64 freebsd/arm64; do
            os=${t%%/*}; rest=${t#*/}; arch=${rest%%:*}; var=""
            [ "$rest" != "$arch" ] && var=${rest#*:}
            out="xhttp-splitter-${os}-${arch}"
            export GOOS=$os GOARCH=$arch GOARM= GOMIPS= CGO_ENABLED=0
            case "$arch" in
              arm) export GOARM=$var; out="${out}v${var}" ;;
              mips|mipsle) export GOMIPS=$var ;;
            esac
            [ "$os" = windows ] && out="${out}.exe"
            echo "building $out"
            go build -trimpath -buildvcs=false -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/$out" .
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
